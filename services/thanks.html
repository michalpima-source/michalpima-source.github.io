<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תודה! – מיכל פימה בשן</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../profile.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:'Rubik',system-ui,sans-serif;color:#2A1240;background:linear-gradient(160deg,#FFE3F1 0%,#F1E6FF 55%,#FFF4FA 100%);overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
.b1{width:420px;height:420px;background:#FF9ECB;top:-140px;right:-100px;animation:d1 16s ease-in-out infinite}
.b2{width:380px;height:380px;background:#B99BFF;bottom:-160px;left:-80px;animation:d2 19s ease-in-out infinite}
@keyframes d1{50%{transform:translate(60px,40px) scale(1.1)}}
@keyframes d2{50%{transform:translate(-50px,-30px) scale(1.15)}}
.spark{position:absolute;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.4) rotate(0);opacity:.25}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.card{position:relative;max-width:520px;width:100%;background:#FFFFFF;border-radius:32px;padding:40px 28px;text-align:center;box-shadow:0 30px 60px -30px rgba(91,33,182,.6);animation:pop .7s ease both;display:grid;gap:16px;justify-items:center}
.card img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #FFFFFF;box-shadow:0 0 0 4px #D6337F}
h1{margin:0;font-family:'Secular One','Rubik',sans-serif;font-weight:400;font-size:clamp(30px,6vw,42px);line-height:1.15}
.shine{background:linear-gradient(90deg,#D6337F,#8B4FF0,#FF7BB8,#D6337F);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
p{margin:0;font-size:18px;line-height:1.6;color:#4D3A63}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;background:linear-gradient(110deg,#C92A74,#7B3FE4,#C92A74);background-size:200% auto;animation:shimmer 5s linear infinite}
.back{color:#B02A6C;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<span class="blob b1" aria-hidden="true"></span><span class="blob b2" aria-hidden="true"></span>
<i class="spark" aria-hidden="true" style="width:22px;height:22px;background:#D6337F;top:14%;right:20%"></i>
<i class="spark" aria-hidden="true" style="width:14px;height:14px;background:#7B3FE4;bottom:18%;right:12%;animation-delay:.8s"></i>
<i class="spark" aria-hidden="true" style="width:18px;height:18px;background:#FFB800;top:22%;left:14%;animation-delay:1.4s"></i>
<main class="card">
<img src="../profile.jpg" alt="מיכל פימה בשן">
<h1><span class="shine">תודה!</span> הפנייה הגיעה אליי</h1>
<p>אחזור אליכם בהקדם לשיחה קצרה. ממהרים? אפשר גם לכתוב לי ישר לוואטסאפ.</p>

כתבו לי בוואטסאפ
</a>

</main>
</body>
</html>
